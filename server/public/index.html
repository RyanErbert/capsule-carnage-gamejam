<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capsule Carnage — Spectator</title>
  <style>
    @font-face {
      font-family: '04b_03';
      src: url('/fonts/04B_03__.TTF') format('truetype');
      font-display: swap;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: #0c0e12;
      color: #dde3ea;
      font-family: '04b_03', monospace;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
      padding: 10px 16px;
      background: #12151c;
      border-bottom: 1px solid #222835;
      font-size: 13px;
    }
    header h1 { font-size: 18px; color: #ffd54a; letter-spacing: 1px; margin-right: 8px; }
    header .stat { color: #8b95a5; }
    header .stat b { color: #dde3ea; font-weight: normal; }
    #conn { padding: 2px 8px; border-radius: 4px; background: #4a1515; color: #ff8080; }
    #conn.ok { background: #12401c; color: #7dedb0; }
    main { flex: 1; display: flex; min-height: 0; }
    #map-wrap { flex: 1; position: relative; min-width: 0; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #empty-note {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #4a5568; font-size: 16px; pointer-events: none; text-align: center; line-height: 1.8;
    }
    aside {
      width: 320px; display: flex; flex-direction: column;
      background: #12151c; border-left: 1px solid #222835; min-height: 0;
    }
    aside h2 {
      font-size: 12px; color: #8b95a5; letter-spacing: 2px; text-transform: uppercase;
      padding: 10px 14px 6px;
    }
    #scoreboard { padding: 0 14px 10px; font-size: 14px; max-height: 40%; overflow-y: auto; }
    #scoreboard .row { display: flex; justify-content: space-between; padding: 3px 0; }
    #scoreboard .row .name::before { content: '● '; }
    #scoreboard .row.it .name::after { content: ' [IT]'; color: #ffd54a; }
    #chat-log {
      flex: 1; overflow-y: auto; padding: 4px 14px; font-size: 13px; line-height: 1.5;
      border-top: 1px solid #222835; min-height: 0;
    }
    #chat-log .sys { color: #ffd54a; }
    #chat-form { display: flex; border-top: 1px solid #222835; }
    #chat-input {
      flex: 1; background: #0c0e12; border: none; outline: none; color: #fff;
      font-family: inherit; font-size: 13px; padding: 10px 14px;
    }
    #chat-form button {
      background: #222835; border: none; color: #8b95a5; font-family: inherit;
      padding: 0 16px; cursor: pointer;
    }
    #chat-form button:hover { color: #fff; }
    footer {
      padding: 6px 16px; font-size: 11px; color: #4a5568;
      background: #12151c; border-top: 1px solid #222835;
    }
    footer a { color: #6b7688; }
  </style>
</head>
<body>
  <header>
    <h1>CAPSULE CARNAGE</h1>
    <span id="conn">connecting…</span>
    <span class="stat">players <b id="d-players">0</b></span>
    <span class="stat">holder <b id="d-holder">—</b></span>
    <span class="stat">build <b id="d-build">?</b></span>
    <span class="stat">uptime <b id="d-uptime">—</b></span>
    <span class="stat">ping <b id="d-ping">—</b></span>
    <span class="stat">msgs/s <b id="d-rate">0</b></span>
    <span class="stat">level <b id="d-level">—</b></span>
  </header>
  <main>
    <div id="map-wrap">
      <canvas id="map"></canvas>
      <div id="empty-note">no players in game<br>overhead view appears when someone joins</div>
    </div>
    <aside>
      <h2>Scoreboard</h2>
      <div id="scoreboard"></div>
      <h2>Chat</h2>
      <div id="chat-log"></div>
      <form id="chat-form" autocomplete="off">
        <input id="chat-input" maxlength="200" placeholder="chat as Spectator…">
        <button type="submit">send</button>
      </form>
    </aside>
  </main>
  <footer>
    spectator &amp; diagnostics view — the game itself runs in Godot
    (<a href="https://github.com/RyanErbert/capsule-carnage-gamejam">capsule-carnage-gamejam</a>)
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // --- State ---
    const players = {};        // id -> {x,y,z,name,skinColor,...}
    const trails = {};         // id -> [{x,z}] (recent positions)
    let scores = {};
    let holder = null;
    let serverStart = null;    // Date.now()-based estimate from uptimeMs
    let msgCount = 0;

    const $ = (id) => document.getElementById(id);

    // --- Socket wiring ---
    socket.on('connect', () => { $('conn').textContent = 'connected'; $('conn').classList.add('ok'); });
    socket.on('disconnect', () => {
      $('conn').textContent = 'disconnected'; $('conn').classList.remove('ok');
      for (const id of Object.keys(players)) delete players[id];
      for (const id of Object.keys(trails)) delete trails[id];
      scores = {}; holder = null;
      refreshPanels();
    });
    socket.onAny(() => { msgCount++; });

    socket.on('spectatorPlayers', (data) => {
      for (const id of Object.keys(players)) delete players[id];
      Object.assign(players, data.players || {});
      scores = data.scores || {};
      holder = data.holder || null;
      if (data.build) $('d-build').textContent = data.build;
      if (typeof data.uptimeMs === 'number') serverStart = Date.now() - data.uptimeMs;
      if (data.activeLevel) $('d-level').textContent = data.activeLevel;
      refreshPanels();
    });
    socket.on('newPlayer', (p) => { if (p && p.id) { players[p.id] = p; refreshPanels(); } });
    socket.on('playerMoved', (d) => {
      if (!d || !players[d.id]) return;
      const p = players[d.id];
      p.x = d.x; p.y = d.y; p.z = d.z;
      const t = trails[d.id] || (trails[d.id] = []);
      t.push({ x: d.x, z: d.z });
      if (t.length > 150) t.shift();
    });
    socket.on('playerDisconnected', (id) => { delete players[id]; delete trails[id]; refreshPanels(); });
    socket.on('scores', (s) => { scores = s || {}; refreshPanels(); });
    socket.on('holderChanged', (h) => { holder = h; refreshPanels(); });
    socket.on('levelChanged', (l) => { $('d-level').textContent = l; });
    socket.on('gameEnded', () => addChatRow(null, null, 'Game ended.', true));
    socket.on('chatMessage', (m) => { if (m && m.text) addChatRow(m.name || 'Player', m.color, m.text, false); });
    socket.on('systemMessage', (m) => { if (m && m.text) addChatRow(null, null, m.text, true); });

    // --- Diagnostics ticks ---
    setInterval(() => {
      const start = Date.now();
      socket.timeout(3000).emit('pingCheck', (err) => {
        $('d-ping').textContent = err ? '—' : (Date.now() - start) + 'ms';
      });
    }, 2000);
    setInterval(() => {
      $('d-rate').textContent = msgCount; msgCount = 0;
      if (serverStart) {
        let s = Math.floor((Date.now() - serverStart) / 1000);
        const h = Math.floor(s / 3600); s %= 3600;
        const m = Math.floor(s / 60); s %= 60;
        $('d-uptime').textContent = (h ? h + 'h ' : '') + (m ? m + 'm ' : '') + s + 's';
      }
    }, 1000);

    // --- Sidebar panels ---
    function nameOf(id) { return players[id] ? players[id].name : '???'; }
    function refreshPanels() {
      $('d-players').textContent = Object.keys(players).length;
      $('d-holder').textContent = holder && players[holder] ? nameOf(holder) : '—';
      const rows = Object.keys(scores)
        .filter((id) => players[id])
        .sort((a, b) => (scores[b] || 0) - (scores[a] || 0))
        .map((id) => {
          const c = players[id].skinColor || '#fff';
          return `<div class="row ${id === holder ? 'it' : ''}">` +
            `<span class="name" style="color:${c}">${esc(nameOf(id))}</span>` +
            `<span>${scores[id] || 0}</span></div>`;
        });
      $('scoreboard').innerHTML = rows.join('') || '<div class="row" style="color:#4a5568">nobody in game</div>';
      $('empty-note').style.display = Object.keys(players).length ? 'none' : 'flex';
    }
    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

    // --- Chat ---
    function addChatRow(name, color, text, sys) {
      const log = $('chat-log');
      const div = document.createElement('div');
      if (sys) { div.className = 'sys'; div.textContent = text; }
      else {
        const b = document.createElement('span');
        b.style.color = /^#[0-9a-fA-F]{3,8}$/.test(color || '') ? color : '#fff';
        b.textContent = name + ': ';
        div.appendChild(b);
        div.appendChild(document.createTextNode(text));
      }
      log.appendChild(div);
      while (log.children.length > 60) log.removeChild(log.firstChild);
      log.scrollTop = log.scrollHeight;
    }
    $('chat-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const msg = $('chat-input').value.trim();
      if (msg) socket.emit('chat', msg);
      $('chat-input').value = '';
    });

    // --- Overhead map (top-down X/Z, auto-fit camera) ---
    const canvas = $('map');
    const ctx = canvas.getContext('2d');
    let view = { cx: 0, cz: 0, scale: 8 };  // smoothed camera

    function frame() {
      const wrap = $('map-wrap');
      const dpr = window.devicePixelRatio || 1;
      const w = wrap.clientWidth, h = wrap.clientHeight;
      if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
        canvas.width = w * dpr; canvas.height = h * dpr;
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      const ids = Object.keys(players);
      if (ids.length) {
        // Fit all players with padding; never zoom tighter than a 40u span.
        let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
        for (const id of ids) {
          const p = players[id];
          minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
          minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z);
        }
        const spanX = Math.max(maxX - minX, 40), spanZ = Math.max(maxZ - minZ, 40);
        const tScale = Math.min(w / (spanX * 1.4), h / (spanZ * 1.4));
        const tCx = (minX + maxX) / 2, tCz = (minZ + maxZ) / 2;
        const k = 0.06;  // camera smoothing
        view.cx += (tCx - view.cx) * k;
        view.cz += (tCz - view.cz) * k;
        view.scale += (tScale - view.scale) * k;
      }
      const toX = (x) => w / 2 + (x - view.cx) * view.scale;
      const toY = (z) => h / 2 + (z - view.cz) * view.scale;

      // Grid: 4u minor (the build grid), 20u major, with axis labels.
      const step = 4;
      const x0 = Math.floor((view.cx - w / 2 / view.scale) / step) * step;
      const x1 = view.cx + w / 2 / view.scale;
      const z0 = Math.floor((view.cz - h / 2 / view.scale) / step) * step;
      const z1 = view.cz + h / 2 / view.scale;
      ctx.font = '10px monospace';
      for (let x = x0; x <= x1; x += step) {
        const major = Math.round(x) % 20 === 0;
        ctx.strokeStyle = major ? '#232a38' : '#161a22';
        ctx.beginPath(); ctx.moveTo(toX(x), 0); ctx.lineTo(toX(x), h); ctx.stroke();
        if (major) { ctx.fillStyle = '#39445a'; ctx.fillText(Math.round(x), toX(x) + 3, h - 6); }
      }
      for (let z = z0; z <= z1; z += step) {
        const major = Math.round(z) % 20 === 0;
        ctx.strokeStyle = major ? '#232a38' : '#161a22';
        ctx.beginPath(); ctx.moveTo(0, toY(z)); ctx.lineTo(w, toY(z)); ctx.stroke();
        if (major) { ctx.fillStyle = '#39445a'; ctx.fillText(Math.round(z), 4, toY(z) - 4); }
      }

      // Trails (fading)
      for (const id of ids) {
        const t = trails[id];
        if (!t || t.length < 2) continue;
        const color = players[id].skinColor || '#ffffff';
        for (let i = 1; i < t.length; i++) {
          ctx.globalAlpha = (i / t.length) * 0.35;
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(toX(t[i - 1].x), toY(t[i - 1].z));
          ctx.lineTo(toX(t[i].x), toY(t[i].z));
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }

      // Players
      const r = Math.max(6, 0.5 * view.scale);
      for (const id of ids) {
        const p = players[id];
        const x = toX(p.x), y = toY(p.z);
        if (id === holder) {  // pulsing gold ring on the oddball holder
          ctx.strokeStyle = '#ffd54a';
          ctx.lineWidth = 3;
          ctx.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 150);
          ctx.beginPath(); ctx.arc(x, y, r + 5, 0, Math.PI * 2); ctx.stroke();
          ctx.globalAlpha = 1;
        }
        ctx.fillStyle = p.skinColor || '#ffffff';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#dde3ea';
        ctx.font = '12px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`${p.name} (${scores[id] || 0})`, x, y - r - 8);
        ctx.fillStyle = '#6b7688';
        ctx.font = '10px monospace';
        ctx.fillText('y ' + (p.y || 0).toFixed(1), x, y + r + 12);
        ctx.textAlign = 'left';
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
