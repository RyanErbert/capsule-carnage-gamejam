<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cube Fight!</title>
  <style>
    @font-face {
      font-family: '04b_03';
      src: url('/fonts/04B_03__.TTF') format('truetype');
      font-display: swap;
    }
    @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap');
    * { margin: 0; padding: 0; }
    body { overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    canvas { display: block; touch-action: none; }
    #name-screen {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      font-family: '04b_03', Lato, LatoExtended, sans-serif;
      color: white;
      overflow-y: auto;
      padding: 10px 0;
    }
    #menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 12px;
      width: 90%;
      max-width: 800px;
      flex: 1;
      min-height: 0;
    }
    .menu-panel {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      overflow: hidden;
    }
    .menu-panel h2 {
      font-size: 11px;
      color: #888;
      letter-spacing: 2px;
      margin: 0;
    }
    #play-panel {
      justify-content: space-between;
    }
    /* Single-map selector */
    .single-map {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .single-map-stage {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .single-map-stage .level-card {
      cursor: default;
      width: 100%;
      max-width: 480px;
    }
    .single-map-stage .level-card:hover {
      transform: none;
      border-color: #4488ff;
    }
    .single-map-stage .level-card canvas {
      width: 100%;
      height: auto;
    }
    .map-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .map-name {
      font-size: 14px;
      color: #fff;
      letter-spacing: 1px;
      text-transform: capitalize;
      min-width: 110px;
      text-align: center;
    }
    #title-canvas { image-rendering: pixelated; margin-bottom: 4px; }
    #name-screen label { font-size: 13px; color: #aaa; }
    #name-input {
      font-size: 18px;
      padding: 6px 14px;
      font-family: '04b_03', Lato, LatoExtended, sans-serif;
      text-align: center;
      border: 2px solid #fff;
      background: rgba(255,255,255,0.1);
      color: white;
      border-radius: 6px;
      outline: none;
      max-width: 200px;
      width: 200px;
      -webkit-user-select: text; user-select: text;
    }
    #name-input::placeholder { color: rgba(255,255,255,0.4); }
    .option-row {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }
    .shape-btn {
      width: 50px; height: 50px;
      border: 2px solid #555;
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      color: white;
      font-family: '04b_03', Lato, LatoExtended, sans-serif;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s;
    }
    .shape-btn.selected { border-color: #4488ff; background: rgba(68,136,255,0.2); }
    .shape-btn:hover { border-color: #88aaff; }
    #color-picker {
      width: 50px; height: 40px;
      border: none; border-radius: 6px;
      cursor: pointer; background: none;
    }
    #join-btn {
      margin-top: 8px;
      padding: 10px 32px;
      font-size: 18px;
      font-family: '04b_03', Lato, LatoExtended, sans-serif;
      font-weight: bold;
      background: #4488ff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #join-btn:hover { background: #3366dd; }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: '04b_03', Lato, LatoExtended, sans-serif;
      font-size: 14px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    #leader-display {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-family: '04b_03', Lato, LatoExtended, sans-serif;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
      text-align: center;
      display: none;
      pointer-events: none;
    }
    #leader-display .crown { font-size: 22px; }
    #joystick-base {
      position: absolute;
      bottom: 30px; left: 30px;
      width: 120px; height: 120px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 3px solid rgba(255,255,255,0.4);
      touch-action: none;
      z-index: 30;
    }
    #joystick-knob {
      position: absolute; top: 50%; left: 50%;
      width: 50px; height: 50px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    #jump-btn {
      position: absolute;
      bottom: 40px; right: 40px;
      width: 80px; height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      border: 3px solid rgba(255,255,255,0.6);
      color: white;
      font-family: '04b_03', Lato, LatoExtended, sans-serif;
      font-size: 16px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      user-select: none; -webkit-user-select: none;
      touch-action: none;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
      z-index: 30;
    }
    #jump-btn:active { background: rgba(255,255,255,0.5); }

    /* Scoreboard */
    #scoreboard {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.82);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 10px;
      padding: 16px 24px;
      font-family: '04b_03', Lato, LatoExtended, sans-serif;
      color: white;
      z-index: 20;
      display: none;
      min-width: 260px;
      pointer-events: none;
    }
    #scoreboard h3 {
      text-align: center;
      margin: 0 0 10px 0;
      font-size: 16px;
      letter-spacing: 2px;
      color: #aaa;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 6px;
    }
    .sb-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 14px;
    }
    .sb-row.holder { color: #ff6666; }
    .sb-row.leader { color: #ffd700; }
    .sb-name { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sb-score { font-weight: bold; min-width: 40px; text-align: right; }

    /* Meters */
    .meter-wrap {
      position: absolute;
      bottom: 28px;
      width: 180px;
      height: 10px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 5px;
      overflow: visible;
      pointer-events: none;
      z-index: 5;
    }
    @media (pointer: coarse) {
      .meter-wrap { bottom: 170px; }
    }
    #sprint-meter { left: calc(50% - 195px); }
    #jump-meter   { left: calc(50% + 15px); }
    .meter-fill {
      height: 100%;
      width: 100%;
      border-radius: 4px;
      transition: background-color 0.15s;
    }
    /* Level select */
    #level-select {
      display: none;
      text-align: center;
      width: 100%;
    }
    .level-carousel {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }
    .level-arrow {
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.4);
      color: white;
      font-size: 22px;
      width: 36px; height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      user-select: none; -webkit-user-select: none;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .level-arrow:hover { background: rgba(255,255,255,0.3); }
    .level-grid {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      flex: 1;
      min-width: 0;
    }
    .level-grid::-webkit-scrollbar { display: none; }
    .level-card {
      cursor: pointer;
      border: 2px solid #555;
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.15s, transform 0.15s;
      background: rgba(0,0,0,0.3);
      scroll-snap-align: center;
      flex-shrink: 0;
    }
    .level-card:hover {
      border-color: #88aaff;
      transform: scale(1.05);
    }
    .level-card.selected {
      border-color: #4488ff;
      border-width: 3px;
      box-shadow: 0 0 16px rgba(68,136,255,0.7), inset 0 0 12px rgba(68,136,255,0.15);
    }
    .level-card canvas { display: block; }
    .level-label {
      padding: 4px 8px;
      font-size: 12px;
      text-align: center;
      color: #ccc;
      text-transform: capitalize;
    }

    /* Lobby options */
    .lobby-option {
      padding: 6px 14px;
      border: 2px solid #555;
      border-radius: 6px;
      color: #ccc;
      font-family: '04b_03', Lato, LatoExtended, sans-serif;
      font-size: 11px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      user-select: none; -webkit-user-select: none;
      letter-spacing: 1px;
    }
    .lobby-option:hover:not(.disabled) { border-color: #88aaff; }
    .lobby-option.selected {
      border-color: #4488ff;
      background: rgba(68,136,255,0.2);
      color: white;
    }
    .lobby-option.disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    #infinite-ammo-check {
      width: 16px; height: 16px;
      accent-color: #4488ff;
      cursor: pointer;
    }

    /* Active game panel */
    #active-game-info {
      width: 100%;
      flex: 1;
      display: none;
      overflow-y: auto;
    }
    #active-game-info .agi-box {
      background: rgba(68,136,255,0.08);
      border: 1px solid rgba(68,136,255,0.4);
      border-radius: 10px;
      padding: 10px 16px;
      text-align: center;
    }
    #active-game-info .agi-title {
      font-size: 11px;
      letter-spacing: 2px;
      color: #88aaff;
      margin-bottom: 6px;
    }
    #active-game-info .agi-players {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      justify-content: center;
    }
    #active-game-info .agi-player {
      font-size: 12px;
      color: #ddd;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    #active-game-info .agi-dot {
      width: 9px; height: 9px; border-radius: 50%;
      display: inline-block;
    }
    #active-game-info .agi-empty {
      font-size: 12px;
      color: #888;
    }

    .meter-label {
      position: absolute;
      top: -18px;
      left: 0;
      font-family: '04b_03', Lato, LatoExtended, sans-serif;
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <div id="name-screen">
    <canvas id="title-canvas" width="200" height="40" style="width:min(400px,70vw);height:auto;image-rendering:pixelated;aspect-ratio:5;"></canvas>
    <div id="menu-grid">
      <!-- TOP LEFT: Player Settings -->
      <div class="menu-panel" id="player-panel">
        <h2>PLAYER</h2>
        <input id="name-input" type="text" placeholder="Name" maxlength="16" autofocus>
        <div id="cube-preview-wrap" style="display:flex;flex-direction:column;align-items:center;gap:4px;">
          <canvas id="cube-preview" width="120" height="120" style="border-radius:8px;cursor:pointer;width:90px;height:90px;"></canvas>
          <span style="font-size:10px;color:#aaa;letter-spacing:1px;">CUSTOMIZE COLOR</span>
          <div class="option-row" style="margin-top:2px;">
            <input type="color" id="color-picker" value="#4488ff">
          </div>
        </div>
        <div id="model-select" style="text-align:center;">
          <h2 style="margin-bottom:4px;">CHARACTER</h2>
          <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;">
            <div class="lobby-option model-opt selected" data-model="none">None</div>
            <div class="lobby-option model-opt" data-model="rat">Rat</div>
          </div>
        </div>
      </div>

      <!-- TOP RIGHT: Game Settings -->
      <div class="menu-panel" id="game-panel">
        <h2>GAME SETTINGS</h2>
        <div style="text-align:center;width:100%;">
          <h2 style="margin-bottom:4px;">GAME TYPE</h2>
          <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;">
            <div class="lobby-option selected" data-gametype="reverse-tag">Reverse Tag</div>
            <div class="lobby-option disabled" data-gametype="ctf">CTF</div>
            <div class="lobby-option disabled" data-gametype="deathmatch">Deathmatch</div>
          </div>
        </div>
        <div style="text-align:center;width:100%;">
          <h2 style="margin-bottom:4px;">SCORE LIMIT</h2>
          <div style="display:flex;gap:6px;justify-content:center;">
            <div class="lobby-option selected" data-duration="1000">1000</div>
          </div>
        </div>
        <div style="text-align:center;width:100%;">
          <h2 style="margin-bottom:4px;">STARTING WEAPON</h2>
          <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;">
            <div class="lobby-option weapon-opt selected" data-weapon="none">None</div>
            <div class="lobby-option weapon-opt" data-weapon="machinegun">MG</div>
            <div class="lobby-option weapon-opt" data-weapon="rocket">Rocket</div>
            <div class="lobby-option weapon-opt" data-weapon="mines">Mines</div>
            <div class="lobby-option weapon-opt" data-weapon="grapple">Grapple</div>
          </div>
        </div>
        <div style="text-align:center;">
          <label style="color:#ccc;font-size:11px;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;gap:6px;">
            <input type="checkbox" id="infinite-ammo-check"> INFINITE AMMO
          </label>
        </div>
      </div>

      <!-- BOTTOM LEFT: Map Selection -->
      <div class="menu-panel" id="map-panel">
        <h2>MAP</h2>
        <div id="level-select" style="width:100%;"></div>
      </div>

      <!-- BOTTOM RIGHT: Players + Play -->
      <div class="menu-panel" id="play-panel">
        <h2>PLAYERS</h2>
        <div id="active-game-info"></div>
        <button id="join-btn">PLAY</button>
      </div>
    </div>
  </div>
  <div id="hud" style="display:none;">WASD to move &middot; Space to jump &middot; Shift to sprint</div>
  <div id="leader-display"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
